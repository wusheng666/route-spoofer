name: Android APK

# Builds the sideloaded APK on every push / manual dispatch.
#
# Signing: self-updates only work if the new APK carries the SAME signing
# certificate as the installed one. Android treats a differently signed APK as
# a different app and the installer fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
# So a release build is preferred:
#   * if the four keystore secrets are set  -> assembleRelease, signed with them
#   * otherwise                             -> assembleDebug + a loud warning
#     (the runner generates a fresh debug.keystore on every run, so debug builds
#      CANNOT be installed over an older build; use them for first installs only)
#
# The rolling "latest" release publishes route-spoofer.apk + latest.json. The app
# reads latest.json (versionCode / versionName / sha256 / url) to decide whether
# an update exists, then verifies the downloaded file before installing it.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK Platform 36 (Android 16)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" "platforms;android-36" >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Prepare signing key
        id: signing
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            {
              echo "KEYSTORE_PATH=$KS"
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository's release key."
          else
            echo "::warning title=Unstable signature::KEYSTORE_BASE64 is not set, so this build is debug-signed with a throwaway keystore. It can be installed as a first install but future builds will NOT install over it. Set KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD to enable self-updates."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      # ---- Quality gate: lint + static analysis + unit tests run BEFORE the
      # build. If any check fails the job stops here, so no APK is uploaded and
      # no "latest" release is published.

      - name: Lint web UI (ESLint)
        run: npm run lint

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Kotlin format, static analysis & unit tests
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew ktlintCheck detekt test --stacktrace

      - name: Build APK
        run: |
          cd android
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Stage APK under a fixed filename
        run: |
          set -e
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK" || { echo "::error::APK missing at $APK"; exit 1; }
          cp "$APK" route-spoofer.apk

      - name: Write update manifest (latest.json)
        run: |
          set -e
          VCODE=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+')
          VNAME=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(sha256sum route-spoofer.apk | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "versionCode": ${VCODE},
            "versionName": "${VNAME}",
            "sha256": "${SHA}",
            "url": "https://github.com/${{ github.repository }}/releases/download/latest/route-spoofer.apk"
          }
          JSON
          echo "versionCode=$VCODE versionName=$VNAME sha256=$SHA"
          cat latest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-spoofer-apk
          path: |
            route-spoofer.apk
            latest.json
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          prerelease: false
          files: |
            route-spoofer.apk
            latest.json
